packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@clack/prompts": 1.7.0
  "@better-auth/expo": 1.7.18
  "@eslint/js": ^10.0.1
  "@tailwindcss/postcss": ^4.2.2
  "@tanstack/react-form": ^1.28.5
  "@tanstack/react-query": ^5.95.2
  "@trpc/client": ^11.16.0
  "@trpc/server": ^11.16.0
  "@trpc/tanstack-react-query": ^11.16.0
  auth: 1.7.18
  better-auth: 1.7.18
  eslint: ^10.1.0
  prettier: ^3.8.1
  tailwindcss: ^4.2.2
  typescript: ~6.0.3
  yargs: ^18.0.0
  zod: 4.6.7

catalogs:
  react19:
    "@types/react": ^19.2.14
    "@types/react-dom": ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild

# react-native-worklets' Babel plugin imports these packages at runtime but
# 0.10.1 does not declare them, which breaks isolated pnpm installs on web.
packageExtensions:
  "react-native-worklets@0.10.1":
    dependencies:
      "@babel/generator": ^7.29.0
      "@babel/traverse": ^7.29.0

overrides:
  react: 19.2.3
  react-dom: 19.2.3
  "@types/minimatch": 5.1.2
  esbuild@<=0.24.2: ^0.28.1
  file-type@>=13.0.0 <21.3.1: ">=21.3.1"
  file-type@>=20.0.0 <=21.3.1: ">=21.3.2"
  lightningcss: 1.30.1
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  chalk: "4.1.2"
  markdown-it@<14.3.3: ^14.3.3
  yaml@>=2.0.0 <2.8.3: ">=2.8.3"
  # Pin to last 0.28.x: @better-auth/kysely-adapter@1.6.x imports
  # DEFAULT_MIGRATION_TABLE, which kysely 0.29 removed. 0.28.17 keeps the
  # export and still satisfies the security floor. core only needs kysely types.
  kysely: "0.28.17"
  valibot@>=0.31.0 <1.2.0: ">=1.2.0"
  uuid@<11.1.1: ">=11.1.1"
  ws@>=8.0.0 <8.20.1: ">=8.20.1"
  ajv@>=7.0.0 <8.18.0: ">=8.18.0"
  defu@<=6.1.4: ">=6.1.5"
  fast-uri@<4.2.3: ^4.2.3
  "@xmldom/xmldom@<0.8.15": ^0.8.15
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=3.0.0 <5.0.12: ^5.0.12
  postcss@<8.5.23: ^8.5.23
  drizzle-orm@<0.45.2: ">=0.45.2"
  "@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33": ^4.0.33
  "@babel/core@<7.29.6": ^7.29.6
  "@humanfs/node@<0.16.8": ^0.16.8
  baseline-browser-mapping@<2.11.0: ^2.11.0
  browserslist@<4.28.7: ^4.28.7
  compression@<1.8.2: ^1.8.2
  dompurify@<3.4.17: ^3.4.17
  esbuild@>=0.27.0 <0.28.1: ^0.28.1
  fflate@>=0.4.5 <0.4.9: ^0.4.9
  glob@>=13.0.0 <14.0.2: ^14.0.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  linkify-it@<5.0.2: ^5.0.2
  mysql2@<3.23.1: ^3.23.1
  node-forge@<1.4.1: ^1.4.1
  shell-quote@<1.9.0: ^1.9.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  ws@>=7.0.0 <7.5.11: ^7.5.11
  # Patched releases of these are ESM-only or buffer-only; see patches/.
  decode-uri-component@<0.5.1: ^0.5.1
  image-size@>=0.6.3 <2.0.3: ^2.0.3
  # Also lifts @expo/cli 57 off zod 3; it only uses APIs that zod 4 keeps.
  zod@<4.6.6: ^4.6.7

patchedDependencies:
  metro@0.83.7: patches/metro@0.83.7.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
