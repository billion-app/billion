name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      # The scraper and env packages read configuration at import time, so the
      # suite needs a populated .env even though no test touches the network.
      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Test
        run: pnpm test

      - name: Test Expo tab visibility
        run: node --experimental-strip-types --test apps/expo/src/components/ui/tab-bar-visibility.test.mjs

  bundle-expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Bundle iOS
        run: cd apps/expo && npx expo export --platform ios --output-dir dist

      - name: Bundle Android
        run: cd apps/expo && npx expo export --platform android --output-dir dist

  # Main is the integration line. Publish it to preview for device testing;
  # production OTA releases go through the explicit, runtime-guarded workflow.
  eas-update-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, bundle-expo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview update
        working-directory: apps/expo
        run: |
          eas update \
            --channel preview \
            --platform all \
            --environment preview \
            --message "main@${GITHUB_SHA}" \
            --non-interactive

  # A preview OTA needs a store-signed binary with the same native fingerprint
  # before TestFlight testers can receive it. Reuse a compatible binary while
  # one is finished or building, and create a new one only when native inputs
  # change. Keep this disabled until the named App Store Connect group exists.
  ensure-testflight-preview:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.TESTFLIGHT_PREVIEW_ENABLED == 'true'
    needs: [lint, typecheck, test, bundle-expo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate preview fingerprint
        working-directory: apps/expo
        run: |
          eas fingerprint:generate \
            --platform ios \
            --environment preview \
            --json > "$RUNNER_TEMP/testflight-preview-fingerprint.json"

      - name: Find compatible TestFlight preview build
        id: compatible
        working-directory: apps/expo
        run: |
          FINGERPRINT_HASH="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseEasJsonOutput } from "../../scripts/assert-eas-update-runtime.mjs";
            const fingerprint = parseEasJsonOutput(readFileSync(process.argv[1], "utf8"));
            if (!fingerprint.hash) throw new Error("Generated preview fingerprint has no hash.");
            process.stdout.write(fingerprint.hash);
          ' "$RUNNER_TEMP/testflight-preview-fingerprint.json")"

          eas build:list \
            --platform ios \
            --build-profile testflight-preview \
            --distribution store \
            --fingerprint-hash "$FINGERPRINT_HASH" \
            --limit 50 \
            --json > "$RUNNER_TEMP/testflight-preview-builds.json"

          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { parseEasJsonOutput } from "../../scripts/assert-eas-update-runtime.mjs";
            const builds = parseEasJsonOutput(readFileSync(process.argv[1], "utf8"));
            const usableStatuses = new Set(["FINISHED", "NEW", "IN_QUEUE", "IN_PROGRESS"]);
            const build = builds.find((candidate) => usableStatuses.has(candidate.status));
            appendFileSync(process.env.GITHUB_OUTPUT, `found=${build ? "true" : "false"}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `fingerprint=${process.argv[2]}\n`);
            if (build) {
              appendFileSync(process.env.GITHUB_OUTPUT, `build-id=${build.id}\n`);
              appendFileSync(process.env.GITHUB_OUTPUT, `build-status=${build.status}\n`);
            }
          ' "$RUNNER_TEMP/testflight-preview-builds.json" "$FINGERPRINT_HASH"

      - name: Build and submit TestFlight preview
        if: steps.compatible.outputs.found != 'true'
        working-directory: apps/expo
        run: |
          eas build \
            --platform ios \
            --profile testflight-preview \
            --auto-submit \
            --no-wait \
            --non-interactive \
            --message "TestFlight preview main@${GITHUB_SHA}" \
            --what-to-test "Preview of main. Receives preview OTA updates. Do not promote this build to the App Store."

      - name: Summarise
        run: |
          {
            echo "### TestFlight preview"
            echo
            echo "- Fingerprint: \`${{ steps.compatible.outputs.fingerprint }}\`"
            if [ "${{ steps.compatible.outputs.found }}" = "true" ]; then
              echo "- Reused build: \`${{ steps.compatible.outputs.build-id }}\` (${{ steps.compatible.outputs.build-status }})"
            else
              echo "- No compatible build existed; a new build and submission were queued."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the image the scrapers actually run in production.
  #
  # This lives in `ci.yml` rather than its own workflow so it can `needs:` the
  # checks above. That dependency is the whole point: it makes "only tested code
  # on main reaches production" a property of the graph instead of a convention
  # someone has to remember. big-mac pulls from here and never builds, so a
  # branch that was never merged has no path to prod.
  #
  # Runs on arm64 because big-mac is Apple Silicon under OrbStack; a native
  # runner avoids shipping an emulated amd64 image.
  scraper-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scraper
          platforms: linux/arm64
          push: true
          # `:main` is a convenience pointer for humans. Deploys pin the
          # immutable `:<sha>` tag, resolved to a digest, so a running host is
          # never silently moved by a later push.
          tags: |
            ghcr.io/billion-app/billion-scraper:${{ github.sha }}
            ghcr.io/billion-app/billion-scraper:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Scraper image published"
            echo
            echo '```'
            echo "ghcr.io/billion-app/billion-scraper:${{ github.sha }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
