name: Release OTA (Production)

# Always dispatch from main. The optional source SHA supports compatible backports
# without executing a release workflow from an older or unmerged branch.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional full source commit SHA (defaults to this main run)"
        required: false
        type: string

concurrency:
  group: production-ota
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  OTA_PLATFORM: ios
  SOURCE_REF: ${{ inputs.source_sha || github.sha }}

jobs:
  validate-publish:
    name: Validate runtime and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Require workflow from main
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Dispatch the production OTA workflow from main. Use source_sha for a compatibility backport."
            exit 1
          }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a full commit SHA."
            exit 1
          }

      # Keep the trusted workflow guard on main while allowing the OTA source to
      # be an older release line whose native fingerprint matches a store build.
      - name: Checkout workflow guard
        uses: actions/checkout@v5
        with:
          ref: main
          path: workflow
          persist-credentials: false

      - name: Checkout OTA source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Resolve source commit
        id: source
        working-directory: source
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SUBJECT="$(git log -1 --pretty=%s)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "OTA_MESSAGE=Production OTA ${SOURCE_SHA:0:7}: $SOURCE_SUBJECT" >> "$GITHUB_ENV"

      - name: Assert source is integrated into main
        id: integration
        run: node workflow/scripts/assert-ota-main.mjs source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Copy test environment
        working-directory: source
        shell: bash
        run: cp .env.example .env

      - name: Run repository checks
        working-directory: source
        run: |
          pnpm lint
          pnpm lint:ws
          pnpm typecheck
          pnpm test

      - name: Bundle app
        working-directory: source/apps/expo
        run: pnpm exec expo export --platform "$OTA_PLATFORM" --output-dir dist

      # Do not expose the release token until the selected source has passed its
      # main integration check, install hooks, tests, lint, typecheck, and bundle.
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate OTA fingerprint
        working-directory: source/apps/expo
        run: |
          eas fingerprint:generate \
            --platform "$OTA_PLATFORM" \
            --environment production \
            --json > "$RUNNER_TEMP/eas-update-fingerprint.json"

      - name: Find compatible production build
        working-directory: source/apps/expo
        run: |
          FINGERPRINT_HASH="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseEasJsonOutput } from "../../../workflow/scripts/assert-eas-update-runtime.mjs";
            const fingerprint = parseEasJsonOutput(readFileSync(process.argv[1], "utf8"));
            if (!fingerprint.hash) throw new Error("Generated OTA has no fingerprint hash.");
            process.stdout.write(fingerprint.hash);
          ' "$RUNNER_TEMP/eas-update-fingerprint.json")"

          eas build:list \
            --platform "$OTA_PLATFORM" \
            --build-profile production \
            --status finished \
            --distribution store \
            --channel production \
            --fingerprint-hash "$FINGERPRINT_HASH" \
            --limit 50 \
            --json > "$RUNNER_TEMP/eas-compatible-builds.json"

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseEasJsonOutput } from "../../../workflow/scripts/assert-eas-update-runtime.mjs";
            const builds = parseEasJsonOutput(readFileSync(process.argv[1], "utf8"));
            const build = builds.sort(
              (left, right) => new Date(right.createdAt) - new Date(left.createdAt),
            )[0];
            if (!build) {
              throw new Error("No finished production iOS store build matches this OTA fingerprint. Ship a new TestFlight build instead.");
            }
            process.stdout.write(`TARGET_BUILD_ID=${build.id}\n`);
          ' "$RUNNER_TEMP/eas-compatible-builds.json" >> "$GITHUB_ENV"

      - name: Read compatible production build
        working-directory: source/apps/expo
        run: eas build:view "$TARGET_BUILD_ID" --json > "$RUNNER_TEMP/eas-target-build.json"

      - name: Assert runtime compatibility
        id: runtime
        run: |
          node workflow/scripts/assert-eas-update-runtime.mjs \
            --build-file "$RUNNER_TEMP/eas-target-build.json" \
            --fingerprint-file "$RUNNER_TEMP/eas-update-fingerprint.json" \
            --platform "$OTA_PLATFORM"

      - name: Publish production update
        working-directory: source/apps/expo
        run: |
          eas update \
            --channel production \
            --platform "$OTA_PLATFORM" \
            --environment production \
            --message "$OTA_MESSAGE" \
            --non-interactive

      - name: Summarise
        if: success()
        run: |
          {
            echo "### Production OTA published"
            echo
            echo "- Source: \`${SOURCE_REF}\` (\`${{ steps.source.outputs.sha }}\`)"
            echo "- Verified main: \`${{ steps.integration.outputs.main }}\`"
            echo "- Target: ${{ steps.runtime.outputs.platform }} build \`${{ steps.runtime.outputs.buildId }}\`"
            echo "- App: ${{ steps.runtime.outputs.appVersion }} (${{ steps.runtime.outputs.buildVersion }})"
            echo "- Fingerprint: \`${{ steps.runtime.outputs.fingerprint }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
